apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sbom-platform-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - sbom.example.com
    secretName: sbom-tls
  rules:
  - host: sbom.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sbom-platform-api
            port:
              number: 80
