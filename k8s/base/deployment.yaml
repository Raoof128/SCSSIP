apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-hunting-api
  namespace: threat-hunting
  labels:
    app: threat-hunting-api
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: threat-hunting-api
  template:
    metadata:
      labels:
        app: threat-hunting-api
        component: backend
    spec:
      serviceAccountName: threat-hunting-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: threat-hunting-platform:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: APP_ENV
          value: "production"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: threat-hunting-config
              key: postgres_host
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: threat-hunting-secrets
              key: postgres_password
        - name: API_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: threat-hunting-secrets
              key: api_secret_key
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: threat-hunting-config
              key: redis_host
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: threat-hunting-config
              key: kafka_bootstrap_servers
        envFrom:
        - configMapRef:
            name: threat-hunting-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: models
          mountPath: /app/models
        - name: config
          mountPath: /app/config
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: threat-hunting-models
      - name: config
        configMap:
          name: threat-hunting-app-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: threat-hunting-api
  namespace: threat-hunting
