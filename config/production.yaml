app:
  name: threat-hunting-platform
  environment: production
  host: 0.0.0.0
  port: 8000
  debug: false
  log_level: INFO
  max_workers: 8

database:
  postgres:
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    pool_size: 20
    max_overflow: 40
    pool_timeout: 30
    pool_recycle: 3600

  influxdb:
    url: ${INFLUXDB_URL}
    token: ${INFLUXDB_TOKEN}
    org: ${INFLUXDB_ORG}
    bucket: ${INFLUXDB_BUCKET}
    batch_size: 5000
    flush_interval: 10000  # milliseconds

streaming:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    db: ${REDIS_DB}
    max_connections: 50
    socket_timeout: 5
    socket_connect_timeout: 5

  kafka:
    bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer_group: ${KAFKA_CONSUMER_GROUP}
    topics:
      events: security-events
      anomalies: anomalies
      leads: threat-leads
    auto_offset_reset: earliest
    enable_auto_commit: false
    max_poll_records: 500
    session_timeout_ms: 30000

data_ingestion:
  sources:
    - name: splunk
      enabled: true
      adapter: splunk_adapter
      config:
        url: https://splunk.example.com:8089
        token: ${SPLUNK_TOKEN}
        indexes: [main, security, windows]

    - name: elastic
      enabled: true
      adapter: elastic_adapter
      config:
        hosts: [https://elastic.example.com:9200]
        api_key: ${ELASTIC_API_KEY}
        indices: [logs-*, security-*]

    - name: osquery
      enabled: true
      adapter: osquery_adapter
      config:
        tls_hostname: osquery.example.com
        enroll_secret: ${OSQUERY_SECRET}

    - name: zeek
      enabled: true
      adapter: zeek_adapter
      config:
        log_path: /var/log/zeek
        file_patterns: [conn.log, dns.log, http.log, ssl.log]

  normalization:
    schema_version: 1.0
    field_mapping:
      timestamp: ['@timestamp', 'time', 'EventTime', 'ts']
      source_ip: ['src_ip', 'source.ip', 'SrcIP', 'id.orig_h']
      dest_ip: ['dst_ip', 'destination.ip', 'DstIP', 'id.resp_h']
      user: ['user', 'username', 'user.name', 'UserName']
      host: ['host', 'hostname', 'computer', 'Computer']

  feature_extraction:
    temporal_features:
      - hour_of_day
      - day_of_week
      - is_business_hours
      - time_since_last_event

    statistical_features:
      - event_count_1h
      - event_count_24h
      - unique_source_ips_1h
      - unique_dest_ips_1h
      - bytes_sent_total
      - bytes_received_total

    behavioral_features:
      - new_connection_to_ip
      - rare_process_execution
      - unusual_login_time
      - privilege_escalation_indicator
      - lateral_movement_indicator

analytics:
  models:
    isolation_forest:
      enabled: true
      n_estimators: 200
      max_samples: auto
      contamination: 0.02
      max_features: 1.0
      bootstrap: false
      n_jobs: -1

    autoencoder:
      enabled: true
      input_dim: 200
      encoding_dims: [128, 64, 32]
      activation: relu
      optimizer: adam
      loss: mse
      epochs: 50
      batch_size: 256
      validation_split: 0.2

    statistical:
      enabled: true
      methods:
        - z_score
        - modified_z_score
        - iqr
        - grubbs_test
      confidence_level: 0.99

  ensemble:
    voting_strategy: weighted
    weights:
      isolation_forest: 0.4
      autoencoder: 0.4
      statistical: 0.2
    min_votes: 2
    confidence_threshold: 0.85

  ueba:
    enabled: true
    baseline_period_days: 30
    min_events_for_profile: 100
    profile_update_interval_hours: 6
    peer_group_size: 10
    anomaly_score_threshold: 0.8

    behavioral_categories:
      - authentication
      - file_access
      - network_activity
      - process_execution
      - privilege_usage

  training:
    auto_retrain: true
    retrain_interval_hours: 24
    min_samples_for_training: 10000
    train_test_split: 0.8
    cross_validation_folds: 5
    save_best_model: true

threat_hunting:
  lead_generation:
    enabled: true
    min_anomaly_score: 0.85
    clustering_enabled: true
    cluster_time_window_minutes: 60
    cluster_min_events: 3

  enrichment:
    misp:
      enabled: true
      url: ${MISP_URL}
      api_key: ${MISP_API_KEY}
      verify_ssl: true
      timeout: 30

    attack_mapping:
      enabled: true
      framework_path: data/attack/enterprise-attack.json
      confidence_threshold: 0.7

  correlation:
    enabled: true
    time_window_hours: 24
    max_correlation_depth: 3
    entity_types: [user, host, ip, process]

  prioritization:
    factors:
      - anomaly_score
      - asset_criticality
      - threat_intelligence_match
      - attack_technique_severity
      - event_frequency
    weights: [0.3, 0.25, 0.2, 0.15, 0.1]

api:
  authentication:
    enabled: true
    secret_key: ${API_SECRET_KEY}
    algorithm: HS256
    access_token_expire_minutes: 60

  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst_size: 20

  cors:
    enabled: true
    allow_origins: [https://dashboard.example.com]
    allow_methods: [GET, POST, PUT, DELETE]
    allow_headers: ['*']

  pagination:
    default_page_size: 50
    max_page_size: 500

monitoring:
  prometheus:
    enabled: true
    port: 9090
    metrics_prefix: threat_hunting_

  healthcheck:
    enabled: true
    endpoints:
      - database
      - redis
      - kafka
      - ml_models
    timeout_seconds: 5

  logging:
    level: INFO
    format: json
    output: [console, file]
    file_path: logs/threat-hunting.log
    rotation: daily
    retention_days: 90

performance:
  batch_processing:
    enabled: true
    batch_size: 1000
    max_queue_size: 10000
    worker_threads: 8

  caching:
    enabled: true
    ttl_seconds: 3600
    max_size_mb: 512

  optimization:
    use_multiprocessing: true
    async_io: true
    connection_pooling: true

data_retention:
  raw_events_days: 90
  processed_events_days: 180
  anomalies_days: 365
  threat_leads_days: 730
  models_versions_keep: 5
